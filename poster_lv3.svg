<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1920" fill="#1a1c17"/>
  <rect x="0" y="0" width="1080" height="12" fill="#b89060"/>
  <text x="540" y="130" text-anchor="middle" font-family="serif" font-size="32" font-weight="400" fill="#b89060" letter-spacing="12">溝通變現塾</text>
  <text x="540" y="240" text-anchor="middle" font-family="serif" font-size="84" font-weight="900" fill="#ffffff">吸引式 1vN 公眾演說</text>
  <line x1="100" y1="275" x2="980" y2="275" stroke="#333" stroke-width="1.5"/>
  <text x="100" y="375" font-family="serif" font-size="64" font-weight="900" fill="#ffffff">直播或上台，</text>
  <text x="100" y="462" font-family="serif" font-size="64" font-weight="900" fill="#ffffff">卻讓觀眾</text>
  <text x="388" y="462" font-family="serif" font-size="64" font-weight="900" fill="#cdab7e">毫無互動跟行動</text>
  <text x="900" y="462" font-family="serif" font-size="64" font-weight="900" fill="#ffffff">？</text>
  <text x="100" y="522" font-family="sans-serif" font-size="28" fill="#666">不是你的內容不好，是還沒找到讓整場觀眾跟著你走的演說結構</text>
  <rect x="0" y="558" width="1080" height="250" fill="#0a0e12"/>
  <rect x="0" y="558" width="8" height="250" fill="#b89060"/>
  <text x="60" y="628" font-family="sans-serif" font-size="26" fill="#555" letter-spacing="6">很多人的經驗</text>
  <text x="60" y="690" font-family="serif" font-size="40" font-weight="900" fill="#3a3a3a">說完大家鼓掌，然後就走了</text>
  <text x="60" y="778" font-family="sans-serif" font-size="24" fill="#444">說得精彩，但台下沒有人採取行動</text>
  <line x1="540" y1="578" x2="540" y2="790" stroke="#2a2a2a" stroke-width="2"/>
  <text x="570" y="624" font-family="sans-serif" font-size="26" fill="#b89060" letter-spacing="6">溝通變現塾</text>
  <text x="570" y="718" font-family="serif" font-size="80" font-weight="900" fill="#cdab7e">1＋1 系統</text>
  <text x="570" y="778" font-family="serif" font-size="32" fill="#888">1個月學習＋1個月實戰</text>
  <text x="100" y="890" font-family="sans-serif" font-size="26" fill="#b89060" letter-spacing="8">學員真實成果</text>
  <line x1="100" y1="910" x2="980" y2="910" stroke="#2a2a2a" stroke-width="1.5"/>
  <rect x="100" y="932" width="880" height="145" fill="#1e2119" rx="4"/>
  <rect x="100" y="932" width="8" height="145" fill="#cdab7e"/>
  <text x="130" y="988" font-family="serif" font-size="42" font-weight="900" fill="#cdab7e">新品發佈會 3 小時創造 1,000 萬</text>
  <text x="130" y="1052" font-family="sans-serif" font-size="30" fill="#555">杜芳華 · 企業主・微商主理人</text>
  <rect x="100" y="1094" width="880" height="145" fill="#1e2119" rx="4"/>
  <rect x="100" y="1094" width="8" height="145" fill="#cdab7e"/>
  <text x="130" y="1150" font-family="serif" font-size="42" font-weight="900" fill="#cdab7e">首場演說，一個晚上多 40 位學生</text>
  <text x="130" y="1214" font-family="sans-serif" font-size="30" fill="#555">林雅雯 · 脈輪舞蹈講師</text>
  <rect x="100" y="1256" width="880" height="145" fill="#1e2119" rx="4"/>
  <rect x="100" y="1256" width="8" height="145" fill="#cdab7e"/>
  <text x="130" y="1312" font-family="serif" font-size="42" font-weight="900" fill="#cdab7e">直播成交率從 0 到半年 60 萬</text>
  <text x="130" y="1376" font-family="sans-serif" font-size="30" fill="#555">路隊長 · Podcaster</text>
  <line x1="100" y1="1440" x2="980" y2="1440" stroke="#2a2a2a" stroke-width="1.5"/>
  <text x="260" y="1520" text-anchor="middle" font-family="serif" font-size="56" font-weight="900" fill="#cdab7e">12 週</text>
  <text x="260" y="1570" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#555">完整演說成交系統</text>
  <line x1="540" y1="1455" x2="540" y2="1585" stroke="#2a2a2a" stroke-width="1"/>
  <text x="540" y="1520" text-anchor="middle" font-family="serif" font-size="56" font-weight="900" fill="#cdab7e">1vN</text>
  <text x="540" y="1570" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#555">直播・上台・演說</text>
  <line x1="820" y1="1455" x2="820" y2="1585" stroke="#2a2a2a" stroke-width="1"/>
  <text x="950" y="1520" text-anchor="middle" font-family="serif" font-size="56" font-weight="900" fill="#cdab7e">線上</text>
  <text x="950" y="1570" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#555">直播小班制</text>
  <rect x="100" y="1630" width="880" height="160" fill="#0a0e12" rx="4"/>
  <rect x="100" y="1630" width="8" height="160" fill="#b89060"/>
  <text x="130" y="1690" font-family="serif" font-size="28" fill="#888">最好的演說，</text>
  <text x="130" y="1740" font-family="serif" font-size="28" fill="#cdab7e">不是你說得多精彩，</text>
  <text x="130" y="1778" font-family="serif" font-size="28" fill="#cdab7e">是觀眾聽完主動找上你。</text>
  <line x1="100" y1="1830" x2="980" y2="1830" stroke="#2a2a2a" stroke-width="1"/>
  <text x="540" y="1878" text-anchor="middle" font-family="serif" font-size="36" font-weight="900" fill="#444">溝通變現塾 · 光頭老師</text>
  <text x="540" y="1908" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#333" letter-spacing="6">KAIZUBIANZIAN.COM</text>
